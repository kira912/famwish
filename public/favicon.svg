<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#881337" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Sparkles -->
  <circle cx="110" cy="120" r="12" fill="#fef08a" opacity="0.8" />
  <circle cx="390" cy="110" r="8" fill="#ffffff" opacity="0.9" />
  <circle cx="420" cy="380" r="10" fill="#fef08a" opacity="0.7" />

  <!-- Gift Box Body -->
  <g filter="url(#shadow)">
    <!-- Box base -->
    <rect x="116" y="220" width="280" height="200" rx="28" fill="#ffffff" />
    
    <!-- Box Lid -->
    <rect x="96" y="165" width="320" height="65" rx="16" fill="#fdf2f8" />
    <rect x="96" y="218" width="320" height="12" fill="#fbcfe8" opacity="0.5" />

    <!-- Vertical Gold Ribbon -->
    <rect x="226" y="165" width="60" height="255" rx="6" fill="url(#goldRibbon)" />
    
    <!-- Horizontal Gold Ribbon on Lid -->
    <rect x="96" y="185" width="320" height="25" fill="url(#goldRibbon)" />

    <!-- Ribbon Bow -->
    <path d="M 256 165 C 220 100, 150 90, 160 140 C 168 180, 230 165, 256 165 Z" fill="url(#goldRibbon)" />
    <path d="M 256 165 C 292 100, 362 90, 352 140 C 344 180, 282 165, 256 165 Z" fill="url(#goldRibbon)" />
    <!-- Knot -->
    <circle cx="256" cy="165" r="22" fill="#ca8a04" />
    <circle cx="256" cy="165" r="16" fill="#fef08a" />
  </g>

  <!-- Heart Icon on the box -->
  <path d="M 256 310 C 256 310, 216 270, 196 290 C 176 310, 216 350, 256 380 C 296 350, 336 310, 316 290 C 296 270, 256 310, 256 310 Z" fill="#e11d48" opacity="0.9" />
</svg>
